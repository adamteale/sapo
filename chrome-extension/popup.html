<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
    }
    .tab-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .tab-item {
      padding: 5px;
      cursor: pointer;
      border-radius: 4px;
    }
    .tab-item:hover {
      background: #f0f0f0;
    }
    .tab-item.selected {
      background: #e0e0ff;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #startBtn { background: #4CAF50; color: white; }
    #stopBtn { background: #f44336; color: white; }
    .status {
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3 style="margin: 0 0 10px;">Sapo Tab Capture</h3>
  <div class="tab-list" id="tabList"></div>
  <button id="startBtn" disabled>Start Capture</button>
  <button id="stopBtn" disabled>Stop Capture</button>
  <div class="status" id="status">Loading...</div>
  <script src="popup.js"></script>
</body>
</html>
