name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        env:
          VERSION: ${{ github.sha }}-$(date +%Y%m%d)
          DMG: 1
        run: ./scripts/build-app.sh

      - name: Set tag
        id: tag
        run: echo "tag=v$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sapo ${{ github.sha }}
          body: |
            Auto-built from commit `${{ github.sha }}` on ${{ github.event.head_commit.timestamp }}.

            > macOS 14.4+ · unsigned ad-hoc build. Right-click → Open the first time, then approve the microphone permission.
          files: build/Sapo-*.dmg
          draft: false
          prerelease: true
